<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d95ff"/><stop offset="1" stop-color="#1250d6"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".2" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#06205e" flood-opacity=".35"/>
    </filter>
    <clipPath id="card"><rect x="160" y="168" width="320" height="310" rx="58"/></clipPath>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <rect width="640" height="640" fill="url(#glow)"/>
  <g transform="translate(320 318) scale(1.2) translate(-320 -309)">
  <g filter="url(#sh)">
    <rect x="160" y="168" width="320" height="310" rx="58" fill="#fff"/>
  </g>
  <g clip-path="url(#card)">
    <rect x="160" y="168" width="320" height="78" fill="#eaf2ff"/>
  </g>
  <!-- кольца календаря -->
  <rect x="236" y="140" width="22" height="64" rx="11" fill="#fff" stroke="#1a5fe0" stroke-width="8"/>
  <rect x="382" y="140" width="22" height="64" rx="11" fill="#fff" stroke="#1a5fe0" stroke-width="8"/>
  <!-- три пары -->
  <g stroke-linecap="round">
    <line x1="208" y1="286" x2="208" y2="318" stroke="#1a73f5" stroke-width="12"/>
    <line x1="240" y1="293" x2="420" y2="293" stroke="#1b2333" stroke-width="13"/>
    <line x1="240" y1="315" x2="350" y2="315" stroke="#c5ccd8" stroke-width="10"/>

    <line x1="208" y1="350" x2="208" y2="382" stroke="#2fb457" stroke-width="12"/>
    <line x1="240" y1="357" x2="400" y2="357" stroke="#1b2333" stroke-width="13"/>
    <line x1="240" y1="379" x2="330" y2="379" stroke="#c5ccd8" stroke-width="10"/>

    <line x1="208" y1="414" x2="208" y2="446" stroke="#9a4fe0" stroke-width="12"/>
    <line x1="240" y1="421" x2="410" y2="421" stroke="#1b2333" stroke-width="13"/>
    <line x1="240" y1="443" x2="360" y2="443" stroke="#c5ccd8" stroke-width="10"/>
  </g>
  </g>
</svg>
