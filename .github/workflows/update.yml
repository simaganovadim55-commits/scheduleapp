name: Обновление расписания

# Сайт публикуется через GitHub Pages «Deploy from a branch» (main, / (root)).
# Этот workflow только обновляет data/ и коммитит в main — Pages пересобирается сам.

on:
  push:
    branches: [main]
    paths: [config.json, scripts/**]
  schedule:
    - cron: '17 */3 * * *'   # каждые 3 часа
  workflow_dispatch:          # кнопка «Run workflow» вручную

permissions:
  contents: write

concurrency:
  group: schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Забрать расписание с сайта вуза
        run: node scripts/fetch.mjs

      - name: Закоммитить новые данные
        run: |
          git config user.name "schedule-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Расписание обновлено $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push origin HEAD:main
