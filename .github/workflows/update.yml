name: Обновление расписания и деплой

# Settings → Pages → Build and deployment → Source: GitHub Actions.
# Каждый запуск: выгружает список всех групп и расписание каждой в data/ и публикует сайт.
# data/ в git не хранится — она живёт только в опубликованном сайте.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'   # каждые 3 часа
  workflow_dispatch:          # кнопка «Run workflow» — обновить и передеплоить вручную

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: schedule
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - id: pages
        uses: actions/configure-pages@v5

      - name: Забрать группы и расписание с сайта вуза
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/fetch.mjs

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
