<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Расписание</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f2f4f8; --card:#ffffff; --text:#0b1220; --hint:#8a909c; --sep:rgba(60,60,67,.13);
  --accent:#1a73f5; --accent-text:#ffffff; --fill:rgba(118,118,128,.12); --chip:#e8ecf3;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.06);
  --c-lec:#1a73f5; --c-prac:#2fb457; --c-lab:#9a4fe0; --c-exam:#ff3b30; --c-credit:#8a909c; --c-cons:#25a8c2; --c-other:#ff9500;
  --o-blue:#1a73f5; --o-green:#34c759; --o-orange:#ff9500; --o-purple:#af52de; --o-teal:#30b0c7; --o-indigo:#5856d6; --o-yellow:#ffcc00; --o-gray:#8e8e93; --o-red:#ff3b30; --seg-on:#ffffff;
  --radius:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1c1c1e; --text:#ffffff; --hint:#8e8e93; --sep:rgba(84,84,88,.55);
    --accent:#0a84ff; --fill:rgba(118,118,128,.24); --chip:#2c2c2e; --shadow:none; --seg-on:#636366;
    --c-lec:#0a84ff; --c-prac:#30d158; --c-lab:#bf5af2; --c-exam:#ff453a; --c-credit:#98989f; --c-cons:#40c8e0; --c-other:#ff9f0a;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --text:#ffffff; --hint:#8e8e93; --sep:rgba(84,84,88,.55);
  --accent:#0a84ff; --fill:rgba(118,118,128,.24); --chip:#2c2c2e; --shadow:none; --seg-on:#636366;
  --c-lec:#0a84ff; --c-prac:#30d158; --c-lab:#bf5af2; --c-exam:#ff453a; --c-credit:#98989f; --c-cons:#40c8e0; --c-other:#ff9f0a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:none;
  -webkit-user-select:none;user-select:none;
  padding-bottom:calc(104px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.ic{width:1.15em;height:1.15em;flex:none;display:block}
[hidden]{display:none!important}

/* ---------- шапка ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 0}
.group-btn{display:flex;align-items:center;gap:7px;min-width:0;font-size:20px;font-weight:700;letter-spacing:-.3px}
.group-btn .ic{color:var(--accent);width:26px;height:26px}
.group-btn .chev{color:var(--hint);width:18px;height:18px}
.group-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:10px;flex:none;align-items:center}
.round{width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;transition:transform .15s}
.round .ic{width:22px;height:22px}
.round:active,.today-pill:active{transform:scale(.92)}
.today-pill{height:34px;padding:0 14px;border-radius:17px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-size:15px;font-weight:600;transition:transform .15s}

.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 16px 4px}
.title{font-size:34px;font-weight:700;letter-spacing:-.5px;margin:0;line-height:1.1}
.subtitle{color:var(--hint);font-size:17px;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--chip);color:var(--text);border-radius:10px;padding:6px 10px;font-size:14px;font-weight:600;margin-bottom:4px;white-space:nowrap}
.chip .ic{width:16px;height:16px;color:var(--hint)}

/* неделя */
.weekbar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid transparent;transition:border-color .2s}
.weekbar.scrolled{border-bottom-color:var(--sep)}
.week{display:flex;align-items:flex-start;padding:10px 2px 10px}
.week-arrow{width:28px;height:68px;display:grid;place-items:center;color:var(--accent);flex:none;border-radius:12px}
.week-arrow .ic{width:22px;height:22px}
.week-arrow:active{background:var(--fill)}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr)}
.day{display:flex;flex-direction:column;align-items:center;gap:7px}
.day .dp{width:44px;height:68px;border-radius:23px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:background .2s,box-shadow .2s}
.day .wd{font-size:12px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.2px}
.day .num{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--hint);opacity:.45;visibility:hidden}
.day.has .dot{visibility:visible}
.day.today .num{color:var(--accent);font-weight:700}
.day.sel .dp{background:var(--accent);box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent)}
.day.sel .wd{color:color-mix(in srgb,var(--accent-text) 85%,transparent)}
.day.sel .num{color:var(--accent-text);font-weight:700}
.day.sel .dot{background:var(--accent);opacity:1}
.day:active .dp{background:var(--fill)}
.day.sel:active .dp{background:var(--accent)}

/* ---------- карточки пар ---------- */
.content{padding:8px 16px 0;touch-action:pan-y}
.card{display:flex;align-items:stretch;gap:14px;width:100%;background:var(--card);border-radius:var(--radius);
  padding:16px 14px 16px 18px;margin-bottom:12px;box-shadow:var(--shadow);position:relative;transition:transform .15s,background .15s}
.card:active{transform:scale(.985)}
.t{width:54px;flex:none;display:flex;flex-direction:column;gap:3px;font-variant-numeric:tabular-nums}
.t b{font-size:18px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:5px}
.t span{font-size:15px;color:var(--hint)}
.bar{width:4px;border-radius:2px;flex:none;background:var(--k)}
.body{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.disc{font-size:17px;font-weight:600;line-height:1.3;letter-spacing:-.2px}
.tag{font-size:14px;font-weight:600;padding:3px 10px;border-radius:8px;color:var(--k);background:color-mix(in srgb,var(--k) 13%,transparent)}
.meta{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--hint);width:100%}
.m{display:flex;align-items:flex-start;gap:7px;line-height:1.3}
.m .ic{width:16px;height:16px;margin-top:0}
.m.note{color:var(--text)}
.m.note span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m.note .ic{color:var(--o-orange)}
.chev{color:var(--hint);opacity:.7;flex:none;align-self:flex-start;margin-top:3px}
.chev .ic{width:18px;height:18px}
.card.past{opacity:.5}

.card.focus{flex-direction:column;gap:6px;padding:14px 14px 16px 26px;
  background:color-mix(in srgb,var(--accent) 7%,var(--card));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 16%,transparent),var(--shadow)}
.card.focus::before{content:"";position:absolute;left:12px;top:14px;bottom:14px;width:4px;border-radius:2px;background:var(--accent)}
.fh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fh .lbl{font-size:14px;font-weight:600;color:var(--accent)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--accent);
  background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:8px;padding:4px 9px}
.badge .ic{width:15px;height:15px}
.fb{display:flex;gap:14px}
.fb .t{width:auto;min-width:64px}
.fb .t b .ic{color:var(--accent);width:18px;height:18px}
.fb .t span{padding-left:23px}
.vl{width:1px;background:var(--sep);flex:none}
.progress{height:4px;border-radius:2px;background:color-mix(in srgb,var(--accent) 14%,transparent);overflow:hidden;margin-top:6px}
.progress div{height:100%;background:var(--accent);border-radius:2px}

.gap{display:flex;align-items:center;gap:10px;color:var(--hint);font-size:14px;font-weight:500;margin:4px 0 16px}
.gap::before,.gap::after{content:"";flex:1;border-top:1px solid var(--sep)}
.gap .ic{width:18px;height:18px}

.empty{text-align:center;padding:56px 24px;color:var(--hint);font-size:15px;line-height:1.4}
.empty .eico{width:76px;height:76px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent)}
.empty .eico .ic{width:36px;height:36px}
.empty b{display:block;color:var(--text);font-size:20px;font-weight:700;margin-bottom:6px}
.footer{text-align:center;color:var(--hint);font-size:12px;margin:18px 0 8px}
.skel{height:118px;border-radius:var(--radius);margin-bottom:12px;background:linear-gradient(90deg,var(--card) 30%,color-mix(in srgb,var(--card) 70%,var(--fill)) 50%,var(--card) 70%);background-size:300% 100%;animation:sh 1.2s linear infinite;box-shadow:var(--shadow)}
@keyframes sh{from{background-position:100% 0}to{background-position:-50% 0}}
.slide-l{animation:sl .24s ease-out}.slide-r{animation:sr .24s ease-out}
@keyframes sl{from{opacity:0;transform:translateX(24px)}}@keyframes sr{from{opacity:0;transform:translateX(-24px)}}

/* ---------- другие вкладки ---------- */
.phead{padding:calc(20px + env(safe-area-inset-top)) 16px 6px}
.section-h{font-size:13px;color:var(--hint);text-transform:uppercase;margin:22px 16px 7px;letter-spacing:-.05px}
.section-f{font-size:13px;color:var(--hint);margin:7px 16px 0;line-height:1.35}
.list{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;width:100%;min-height:48px;text-align:left;position:relative;background:var(--card)}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row.with-ico+.row.with-ico::before,.irow+.irow::before{left:58px}
button.row:active{background:var(--fill)}
.row .k{display:flex;align-items:center;gap:12px;min-width:0}
.row .v{color:var(--hint);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px}
.row .v .ic{width:16px;height:16px;opacity:.7}
.row .check{color:var(--accent)}
.row small{display:block;color:var(--hint);font-size:13px;margin-top:2px}
.row.hint{color:var(--hint);justify-content:flex-start;gap:10px;font-size:15px}
button.row.hint{color:var(--accent)}
.row.danger{color:var(--o-red)}
.row.act{color:var(--accent);justify-content:flex-start;gap:12px}
.row.center{justify-content:center;font-weight:600}
.sq{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;background:var(--c);flex:none}
.sq .ic{width:18px;height:18px}
.irow{display:flex;align-items:center;gap:12px;padding:10px 16px;position:relative;min-height:56px}
.irow+.irow::before{content:"";position:absolute;top:0;right:0;border-top:.5px solid var(--sep)}
.irow small{display:block;color:var(--hint);font-size:13px}
.irow div{min-width:0;word-break:break-word}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:0;width:100%}
.seg button{flex:1;text-align:center;font-size:14px;font-weight:500;padding:7px 4px;border-radius:7px;transition:background .2s}
.seg button.on{background:var(--seg-on);box-shadow:0 2px 6px rgba(0,0,0,.12);font-weight:600}
.subj .body{gap:6px}
.subj .sub{font-size:14px;color:var(--hint)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.credit{text-align:center;font-size:12px;color:var(--hint);opacity:.45;letter-spacing:.4px;margin:28px 0 4px}
.notecard{display:block;width:100%;background:var(--card);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);text-align:left}
.notecard b{display:block;font-size:16px;font-weight:600;margin-bottom:5px}
.notecard p{margin:0;font-size:15px;line-height:1.4;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.notecard small{display:block;color:var(--hint);font-size:13px;margin-top:8px}

/* ---------- таб-бар ---------- */
.tabbar{position:fixed;left:12px;right:12px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:20;height:66px;border-radius:26px;
  display:grid;grid-template-columns:repeat(4,1fr);align-items:center;
  background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  box-shadow:0 0 0 .5px var(--sep),0 8px 28px rgba(16,24,40,.12)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--hint);padding:6px 0}
.tabbar .ic{width:26px;height:26px;stroke-width:1.8}
.tabbar button.on{color:var(--accent)}
.tabbar button:active{opacity:.6}

/* ---------- листы ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:16px 16px 0 0;
  max-height:90vh;min-height:55vh;display:flex;flex-direction:column;transform:translateY(105%);
  transition:transform .34s cubic-bezier(.2,.9,.3,1);padding-bottom:env(safe-area-inset-bottom)}
.sheet.open{transform:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:6px auto 0}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 16px 8px}
.sheet-h h2{font-size:17px;font-weight:600;margin:0;text-align:center}
.sheet-h button{color:var(--accent);font-size:17px;font-weight:600;justify-self:end}
.sheet-body{overflow:auto;padding:0 16px 24px;-webkit-overflow-scrolling:touch}
.sheet .section-h{margin:18px 16px 7px}
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:8px 10px;margin:6px 0 4px;color:var(--hint)}
.search .ic{width:17px;height:17px}
.search input{flex:1;border:0;outline:0;background:none;font:inherit;color:var(--text);font-size:17px;-webkit-user-select:text;user-select:text}
.dhead{padding:4px 4px 6px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.detail-title{font-size:24px;font-weight:700;line-height:1.2;letter-spacing:-.3px}
.dsub{color:var(--hint);font-size:15px}
textarea.note{display:block;width:100%;min-height:110px;border:0;outline:0;resize:none;background:var(--card);color:var(--text);
  font:inherit;font-size:16px;line-height:1.4;padding:12px 16px;-webkit-user-select:text;user-select:text}
.nores{color:var(--hint);text-align:center;padding:24px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--fill);border-top-color:var(--hint);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.pill{background:var(--accent);color:var(--accent-text);border-radius:12px;padding:11px 24px;font-weight:600;margin-top:14px}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 10px}
.mhead b{font-size:19px;font-weight:700}
.mhead button{width:40px;height:40px;display:grid;place-items:center;color:var(--accent);border-radius:50%}
.mhead button:active{background:var(--fill)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 0;background:var(--card);border-radius:14px;padding:10px 6px 12px;box-shadow:var(--shadow)}
.mgrid .wl{text-align:center;font-size:12px;font-weight:600;color:var(--hint);padding:2px 0 6px;text-transform:uppercase}
.md{display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0}
.md span{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-variant-numeric:tabular-nums}
.md i{width:4px;height:4px;border-radius:50%;background:var(--hint);opacity:.5;visibility:hidden}
.md.has i{visibility:visible}
.md.today span{color:var(--accent);font-weight:700}
.md.sel span{background:var(--accent);color:var(--accent-text);font-weight:700}
.md.out{opacity:.3}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:60;opacity:0;pointer-events:none;
  background:color-mix(in srgb,var(--text) 88%,transparent);color:var(--bg);font-size:15px;font-weight:500;padding:10px 16px;border-radius:14px;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<section id="pg-schedule">
  <header class="top">
    <button class="group-btn" id="groupBtn"><i data-ic="users"></i><span id="groupName">Выбрать группу</span><i data-ic="chev"></i></button>
    <div class="actions">
      <button class="today-pill" id="todayBtn" hidden>Сегодня</button>
      <button class="round" id="calBtn" aria-label="Календарь"><i data-ic="cal"></i></button>
      <button class="round" id="moreBtn" aria-label="Ещё"><i data-ic="more"></i></button>
    </div>
  </header>
  <div class="hero">
    <div><h1 class="title" id="title">Расписание</h1><div class="subtitle" id="subtitle"></div></div>
    <span class="chip" id="countChip" hidden></span>
  </div>
  <div class="weekbar" id="weekbar">
    <div class="week">
      <button class="week-arrow" id="prevW" aria-label="Прошлая неделя"><i data-ic="chevl"></i></button>
      <div class="days" id="days"></div>
      <button class="week-arrow" id="nextW" aria-label="Следующая неделя"><i data-ic="chev"></i></button>
    </div>
  </div>
  <main class="content" id="content"></main>
</section>
<section id="pg-subjects" hidden></section>
<section id="pg-notes" hidden></section>
<section id="pg-settings" hidden></section>

<nav class="tabbar" id="tabbar">
  <button data-tab="schedule" class="on"><i data-ic="cal"></i>Расписание</button>
  <button data-tab="subjects"><i data-ic="book"></i>Пары</button>
  <button data-tab="notes"><i data-ic="list"></i>Заметки</button>
  <button data-tab="settings"><i data-ic="gear"></i>Настройки</button>
</nav>

<div class="overlay" id="overlay"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="sheet-h"><span></span><h2 id="sheetTitle"></h2><button id="sheetClose">Готово</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>
<div class="toast" id="toast"></div>

<script>
(() => {
'use strict';
/* ---------- иконки ---------- */
const P = {
  users:'<path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20"/><circle cx="10" cy="8" r="3.5"/><path d="M20 20v-1.5a3.5 3.5 0 0 0-2.5-3.35M15.5 4.6a3.5 3.5 0 0 1 0 6.8"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/>',
  pin:'<path d="M12 21.5s7-6 7-11.5a7 7 0 0 0-14 0c0 5.5 7 11.5 7 11.5z"/><circle cx="12" cy="10" r="2.5"/>',
  cap:'<path d="M22 9 12 4 2 9l10 5 10-5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 1.5M5 3 2 6M19 3l3 3"/>',
  chev:'<path d="m9 5 7 7-7 7"/>', chevl:'<path d="m15 5-7 7 7 7"/>',
  cal:'<rect x="3.5" y="4.5" width="17" height="16.5" rx="3"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4"/>',

const THEME_VARS = ['--bg','--card','--text','--hint','--accent','--accent-text'];
function applyTheme(){
  const pref = (() => { try { return localStorage.getItem('theme') || 'auto'; } catch(e){ return 'auto'; } })();
  const root = document.documentElement, r = root.style;
  THEME_VARS.forEach(v => r.removeProperty(v));
  if (pref !== 'auto') root.dataset.theme = pref;
  else if (inTG){
    const p = tg.themeParams || {};
    root.dataset.theme = tg.colorScheme === 'dark' ? 'dark' : 'light';
    if (tg.colorScheme === 'dark'){
      if (p.secondary_bg_color) r.setProperty('--bg', p.secondary_bg_color);
      if (p.bg_color) r.setProperty('--card', p.section_bg_color || p.bg_color);
    }
    if (p.text_color) r.setProperty('--text', p.text_color);
    if (p.hint_color) r.setProperty('--hint', p.hint_color);
    if (p.button_color) r.setProperty('--accent', p.button_color);
    if (p.button_text_color) r.setProperty('--accent-text', p.button_text_color);
  } else delete root.dataset.theme;
  if (inTG){ try {
    const bg = getComputedStyle(root).getPropertyValue('--bg').trim();
    tg.setHeaderColor(bg); tg.setBackgroundColor(bg);
    tg.setBottomBarColor && tg.setBottomBarColor(bg);
  } catch(e){} }
}
if (inTG){
  tg.ready(); tg.expand();
  try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch(e){}
  tg.onEvent('themeChanged', applyTheme);
}

const pad = n => String(n).padStart(2,'0');

const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };

const mins = t => { const [h,m] = String(t).split(':').map(Number); return h*60+m; };
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const nowMin = () => { const n = new Date(); return n.getHours()*60+n.getMinutes(); };
const dur = m => { const h = Math.floor(m/60), r = m%60; return (h ? h+' ч ' : '') + (r ? r+' мин' : '').trim(); };

}

/* ---------- живая загрузка с сайта вуза ---------- */
const RUZ = {
  base: 'https://ruz.guz.ru',
  proxy: '',            // адрес своего бесплатного прокси (Cloudflare Worker), см. README. Пусто — только напрямую
  weeksBack: 1, weeksAhead: 8
};
const ruzDate = d => `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`;
async function ruzGet(p){
  const urls = [RUZ.base + p];
  if (RUZ.proxy) urls.push(RUZ.proxy.replace(/\/$/, '') + p);
  let last;
  for (const u of urls){
    const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 12000);
    try {
      const r = await fetch(u, {signal: ctrl.signal});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch(e){ last = e; } finally { clearTimeout(t); }
  }
  throw last;
}
const normLesson = x => ({
  date: String(x.date).slice(0,10).replace(/\./g,'-'), start: x.beginLesson, end: x.endLesson,
  title: x.discipline || x.disciplineName || '', kind: x.kindOfWork || '',
  room: x.auditorium || '', building: x.building || '', teacher: x.lecturer_title || x.lecturer || '',
  subgroup: x.subGroup || '', stream: x.stream || '', note: x.note || x.comment || ''
});
const normName = s => String(s || '').trim().toLowerCase().replace(/\s+/g, '');
async function searchGroups(term){
  const res = await ruzGet(`/api/search?term=${encodeURIComponent(term.trim())}&type=group`);
  return (Array.isArray(res) ? res : res.data || [])
    .map(x => ({id: String(x.id), name: x.label ?? x.name, desc: x.description || ''}))
    .filter(x => x.id && x.name);
}
async function liveSchedule(g){
  const m = monday(today()), s = addDays(m, -7*RUZ.weeksBack), f = addDays(m, 7*RUZ.weeksAhead - 1);
  const raw = await ruzGet(`/api/schedule/group/${encodeURIComponent(g.id)}?start=${ruzDate(s)}&finish=${ruzDate(f)}&lng=1`);
  const lessons = (Array.isArray(raw) ? raw : raw.data || []).map(normLesson)
    .sort((a,b) => (a.date + a.start).localeCompare(b.date + b.start));
  return {group: {id: g.id, name: g.name}, updated: new Date().toISOString(), live: true, lessons};
}

const S = { groups:[], group:null, data:null, byDate:{}, sel:today(), week:monday(today()), loading:false };

async function getJSON(url){
  const r = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now(), {cache:'no-store'});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
async function loadGroups(){
  try { S.groups = await getJSON('data/groups.json'); } catch(e){ S.groups = []; }
  if (!Array.isArray(S.groups)) S.groups = [];
}
const isPrefetched = g => S.groups.some(x => String(x.id) === String(g.id));
function setData(data){
  S.data = data; S.byDate = {};
  for (const l of data.lessons || []) (S.byDate[l.date] ||= []).push(l);
  for (const k in S.byDate) S.byDate[k].sort((a,b) => mins(a.start) - mins(b.start));
}
function saveCache(g, data){ try { localStorage.setItem('sched:' + g.id, JSON.stringify(data)); } catch(e){} }
async function loadSchedule(g){
  let data = null;
  if (g.id === 'demo') data = demo();
  else {
    if (isPrefetched(g)) { try { data = await getJSON(`data/schedule/${encodeURIComponent(g.id)}.json`); } catch(e){} }
    if (!data) { try { data = await liveSchedule(g); } catch(e){} }
    if (data) saveCache(g, data);
    else {
      try { data = JSON.parse(localStorage.getItem('sched:' + g.id)); if (data) data.stale = true; } catch(e){}
      if (!data) data = {group: g, lessons: [], error: true};
    }
  }
  setData(data);
}
// у выгруженных групп тихо проверяем сайт — вдруг там уже свежее, чем в последней выгрузке
async function refreshLive(g){
  if (g.id === 'demo' || !S.data || S.data.live) return;
  try {
    const fresh = await liveSchedule(g);
    if (S.group !== g) return;
    saveCache(g, fresh);
    if (JSON.stringify(fresh.lessons) !== JSON.stringify(S.data.lessons)){ setData(fresh); render(); }
    else { S.data.live = true; S.data.updated = fresh.updated; renderDay(); }
  } catch(e){}
}
async function chooseGroup(g){
  S.group = g;
  store.set('group', JSON.stringify({id: g.id, name: g.name}));
  try {
    const rec = JSON.parse(localStorage.getItem('recent') || '[]').filter(x => String(x.id) !== String(g.id));
    rec.unshift({id: g.id, name: g.name, desc: g.desc || ''}); localStorage.setItem('recent', JSON.stringify(rec.slice(0, 6)));
  } catch(e){}
  S.loading = true; render();
  await loadSchedule(g);
  S.loading = false;
  if (S.group !== g) return;
  render(); refreshLive(g);
}

const MONN = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const plural = (n,a,b,c) => { const m10 = n%10, m100 = n%100; return m10===1 && m100!==11 ? a : m10>=2 && m10<=4 && (m100<10||m100>=20) ? b : c; };
const durLong = m => m < 60 ? `${m} ${plural(m,'минута','минуты','минут')}` : dur(m);
const pairs = n => `${n} ${plural(n,'пара','пары','пар')}`;

function lessonParts(l){
  const room = l.room ? l.room + (l.building && !l.room.includes(l.building) ? ` (${l.building})` : '') : '';
  const grpName = S.group ? normName(S.group.name) : '';
  const stream = l.stream && normName(l.stream) !== grpName ? l.stream : '';
  const n = notes.get(l.title);
  const meta = [
    room && `<div class="m">${ic('pin')}<span>${esc(room)}</span></div>`,
    l.teacher && `<div class="m">${ic('user')}<span>${esc(l.teacher)}</span></div>`,
    l.subgroup && `<div class="m">${ic('users')}<span>${esc(l.subgroup)}</span></div>`,
    stream && `<div class="m">${ic('cap')}<span>Поток ${esc(stream)}</span></div>`,
    n && `<div class="m note">${ic('note')}<span>${esc(n.text)}</span></div>`
  ].filter(Boolean).join('');
  return `<div class="disc">${esc(l.title)}</div>${l.kind ? `<span class="tag">${esc(l.kind)}</span>` : ''}${meta ? `<div class="meta">${meta}</div>` : ''}`;
}

function renderDay(dir){
  const k = key(S.sel), list = S.byDate[k] || [];
  const isToday = k === key(today()), now = nowMin();
  const isPast = S.sel < today();
  let html = '';
  if (S.loading){
    html = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  } else if (S.data && S.data.error){
    html = `<div class="empty"><div class="eico">${ic('wifioff')}</div><b>Не получилось загрузить</b>Сайт вуза не ответил или не пускает запросы из браузера.<br><button class="pill" id="retry">Повторить</button></div>`;
  } else if (!list.length){
    const sun = S.sel.getDay() === 0;
    html = `<div class="empty"><div class="eico">${ic(sun ? 'moon' : 'cup')}</div><b>Пар нет</b>${sun ? 'Воскресенье — отдыхаем' : 'Можно выдохнуть'}</div>`;
  } else {
    // выделяем идущую сейчас пару, а если её нет — ближайшую следующую
    let focus = -1;
    if (isToday){
      focus = list.findIndex(l => now >= mins(l.start) && now < mins(l.end));
      if (focus < 0) focus = list.findIndex(l => mins(l.start) > now);
    }
    list.forEach((l, i) => {
      if (i){
        const g = mins(l.start) - mins(list[i-1].end);
        if (g >= 30) html += `<div class="gap">${ic('cup')}Перерыв · ${durLong(g)}</div>`;
      }
      const s = mins(l.start), e = mins(l.end);
      const past = isPast || (isToday && now >= e);
      const style = `style="--k:${kindColor(l.kind)}"`;
      if (i === focus){
        const live = now >= s;
        html += `<button class="card focus" ${style} data-i="${i}">
          <div class="fh"><span class="lbl">${live ? 'Сейчас идёт' : 'Следующая пара'}</span>
            <span class="badge">${ic('timer')}${live ? 'ещё ' + dur(e-now) : dur(s-now)}</span></div>
          <div class="fb"><div class="t"><b>${ic('clock')}${esc(l.start)}</b><span>${esc(l.end)}</span></div><div class="vl"></div>
            <div class="body">${lessonParts(l)}</div><div class="chev">${ic('chev')}</div></div>
          ${live ? `<div class="progress"><div style="width:${Math.round((now-s)/(e-s)*100)}%"></div></div>` : ''}
        </button>`;
      } else {
        html += `<button class="card${past ? ' past' : ''}" ${style} data-i="${i}">
          <div class="t"><b>${esc(l.start)}</b><span>${esc(l.end)}</span></div><div class="bar"></div>
          <div class="body">${lessonParts(l)}</div><div class="chev">${ic('chev')}</div></button>`;
      }
    });
  }
  html += footer();
  const c = $('content');
  c.innerHTML = html;

}

function updatedText(){
  if (!S.data || !S.data.updated) return '';
  if (S.data.group && S.data.group.id === 'demo') return 'Демо-данные · выбери свою группу сверху';
  const u = new Date(S.data.updated);
  const pre = S.data.stale ? 'Нет связи с сайтом · сохранённая копия от' : S.data.live ? 'С сайта вуза ·' : 'Обновлено';
  return `${pre} ${u.getDate()} ${MON[u.getMonth()]}, ${pad(u.getHours())}:${pad(u.getMinutes())}`;
}
const footer = () => !S.loading && updatedText() ? `<div class="footer">${updatedText()}</div>` : '';

/* ---------- вкладка «Пары»: все предметы группы ---------- */
function subjects(){
  const map = new Map(), tk = key(today());
  const all = [...(S.data && S.data.lessons || [])].sort((a,b) => (a.date + a.start).localeCompare(b.date + b.start));
  for (const l of all){
    let s = map.get(l.title);
    if (!s) map.set(l.title, s = {title: l.title, lessons: [], kinds: new Map(), teachers: new Set(), next: null});
    s.lessons.push(l);
    if (l.kind) s.kinds.set(l.kind, (s.kinds.get(l.kind) || 0) + 1);
    if (l.teacher) s.teachers.add(l.teacher);
    if (!s.next && l.date >= tk) s.next = l;
  }
  return [...map.values()].sort((a,b) =>
    (a.next ? 0 : 1) - (b.next ? 0 : 1) || (a.next && b.next ? (a.next.date + a.next.start).localeCompare(b.next.date + b.next.start) : 0) || a.title.localeCompare(b.title, 'ru'));
}
function renderSubjects(){

  if (!list.length) html += `<div class="empty"><div class="eico">${ic('book')}</div><b>Пока пусто</b>Здесь появятся предметы твоей группы</div>`;
  list.forEach((s, i) => {
    const top = [...s.kinds.entries()].sort((a,b) => b[1] - a[1]);
    const nd = s.next && new Date(s.next.date + 'T00:00');
    html += `<button class="card subj${s.next ? '' : ' past'}" style="--k:${kindColor(top[0] && top[0][0])}" data-s="${i}">
      <div class="bar"></div><div class="body">
        <div class="disc">${esc(s.title)}</div>
        <div class="sub">${s.lessons.length} ${plural(s.lessons.length,'занятие','занятия','занятий')}${nd ? ` · далее ${shortDate(nd)}, ${esc(s.next.start)}` : ' · больше не будет'}</div>
        ${top.length ? `<div class="tags">${top.map(([k]) => `<span class="tag" style="--k:${kindColor(k)}">${esc(k)}</span>`).join('')}</div>` : ''}

function openSubject(s){
  const tk = key(today());

  const rows = arr => `<div class="list">${arr.map(l => { const d = new Date(l.date + 'T00:00');

/* ---------- календарь на месяц ---------- */
function openMonth(){
  let m = new Date(S.sel.getFullYear(), S.sel.getMonth(), 1);
  const draw = () => {
    const t = key(today()), s = key(S.sel), start = addDays(m, -((m.getDay()+6)%7));
    let cells = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(w => `<div class="wl">${w}</div>`).join('');
    for (let i = 0; i < 42; i++){
      const d = addDays(start, i), k = key(d);
      if (i >= 35 && d.getMonth() !== m.getMonth()) break;
      const cls = ['md', k===t && 'today', k===s && 'sel', S.byDate[k] && 'has', d.getMonth() !== m.getMonth() && 'out'].filter(Boolean).join(' ');
      cells += `<button class="${cls}" data-k="${k}"><span>${d.getDate()}</span><i></i></button>`;
    }
    $('sheetBody').innerHTML = `<div class="mhead"><button data-m="-1" aria-label="Назад">${ic('chevl')}</button><b>${MONN[m.getMonth()]} ${m.getFullYear()}</b><button data-m="1" aria-label="Вперёд">${ic('chev')}</button></div>
      <div class="mgrid">${cells}</div>
      <div class="section-h"></div><div class="list"><button class="row act" data-today>${ic('calok')}Перейти к сегодня</button></div>`;
  };
  openSheet('Календарь', '');
  draw();
  $('sheetBody').onclick = e => {
    const mb = e.target.closest('[data-m]');
    if (mb){ m = new Date(m.getFullYear(), m.getMonth() + +mb.dataset.m, 1); haptic(); return draw(); }
    const b = e.target.closest('[data-k]'), td = e.target.closest('[data-today]');
    if (!b && !td) return;
    closeSheet(); select(td ? today() : new Date(b.dataset.k + 'T00:00'));
  };
}

// ключ для поиска: без регистра, пробелов и точек; «3» = «З», латинские двойники = кириллица
const LAT = {a:'а',b:'в',c:'с',e:'е',h:'н',k:'к',m:'м',o:'о',p:'р',t:'т',x:'х',y:'у',z:'з'};
const skey = s => normName(s).replace(/[.\-_/]/g, '').replace(/[a-z]/g, c => LAT[c] || c).replace(/з/g, '3');
function findGroups(q){
  const k = skey(q); if (!k) return [];
  return S.groups.map(g => {
    const n = g._k || (g._k = skey(g.name)), i = n.indexOf(k);
    return {g, r: i === 0 ? 0 : i > 0 ? 1 : skey(g.desc).includes(k) ? 2 : -1};
  }).filter(x => x.r >= 0).sort((a,b) => a.r - b.r || a.g.name.localeCompare(b.g.name, 'ru', {numeric:true})).map(x => x.g);
}
function openGroups(){
  let recent = [];
  try { recent = JSON.parse(localStorage.getItem('recent') || '[]'); } catch(e){}
  let remote = {q:'', state:'idle', items:[]}, timer = null, seq = 0, local = [];
  const LIMIT = 60;
  const pool = new Map();
  const rowsHtml = list => `<div class="list">${list.map(g => { pool.set(String(g.id), g); return `<button class="row" data-id="${esc(g.id)}">
      <span>${esc(g.name)}${g.desc ? `<small>${esc(g.desc)}</small>` : ''}</span>
      ${S.group && String(S.group.id) === String(g.id) ? `<span class="check">${ic('check')}</span>` : ''}</button>`; }).join('')}</div>`;
  const draw = () => {
    const raw = $('gq').value.trim();
    let html = '';
    if (!skey(raw)){
      if (recent.length) html += `<div class="section-h">Недавние</div>` + rowsHtml(recent);
      html += `<div class="nores">Начни вводить название — например, З.КН или 24.Б7${S.groups.length > 1 ? `<br>В базе ${S.groups.length} ${plural(S.groups.length,'группа','группы','групп')}` : ''}</div>`;
    } else {
      if (local.length){
        html += `<div class="section-h">Найдено · ${local.length}</div>` + rowsHtml(local.slice(0, LIMIT));
        if (local.length > LIMIT) html += `<div class="section-f">Показаны первые ${LIMIT} — уточни запрос</div>`;
      } else if (skey(raw).length >= 2){
        // в базе нет — пробуем сайт вуза напрямую
        html += `<div class="section-h">На сайте вуза</div>`;
        if (remote.state === 'loading') html += `<div class="list"><div class="row hint"><span class="spin"></span>Ищу «${esc(raw)}»…</div></div>`;
        else if (remote.state === 'error') html += `<div class="list"><div class="row hint">Группа «${esc(raw)}» не найдена — проверь написание</div></div>`;
        else if (remote.items.length) html += rowsHtml(remote.items);
        else if (remote.state === 'done') html += `<div class="list"><div class="row hint">Группа не найдена — проверь написание</div></div>`;
      }
    }
    $('glist').innerHTML = html;
  };
  const lookup = () => {
    const q = $('gq').value.trim();
    clearTimeout(timer); seq++;
    local = findGroups(q);
    if (local.length || skey(q).length < 2){ remote = {q, state:'idle', items:[]}; draw(); return; }
    remote = {q, state:'loading', items:[]}; draw();
    timer = setTimeout(async () => {
      const my = ++seq;
      try { const items = await searchGroups(q); if (my === seq){ remote = {q, state:'done', items}; draw(); } }
      catch(e){ if (my === seq){ remote = {q, state:'error', items:[]}; draw(); } }
    }, 350);
  };
  openSheet('Группа', `<label class="search">${ICON.search}<input id="gq" placeholder="Например, З.КН.24.Б7" autocomplete="off" autocapitalize="characters" enterkeyhint="search" spellcheck="false"></label><div id="glist"></div>`);
  draw();
  $('gq').oninput = lookup;
  $('gq').onkeydown = e => {
    if (e.key !== 'Enter') return;
    const k = skey(e.target.value), all = local.length ? local : remote.items;
    const hit = all.find(g => skey(g.name) === k) || (all.length === 1 && all[0]);
    if (hit){ haptic('light'); closeSheet(); chooseGroup(hit); } else e.target.blur();
  };
  $('glist').onclick = e => {
    const b = e.target.closest('[data-id]'); if (!b) return;
    haptic('light'); closeSheet(); chooseGroup(pool.get(b.dataset.id));
  };
  if (!inTG || tg.platform !== 'ios') setTimeout(() => { try { $('gq').focus(); } catch(e){} }, 350);
}

/* ---------- events ---------- */
$('days').onclick = e => { const b = e.target.closest('[data-k]'); if (b) select(new Date(b.dataset.k + 'T00:00')); };
$('prevW').onclick = () => select(addDays(S.sel, -7), -1);
$('nextW').onclick = () => select(addDays(S.sel, 7), 1);
$('todayBtn').onclick = () => select(today());
$('groupBtn').onclick = openGroups;
$('calBtn').onclick = openMonth;
$('moreBtn').onclick = openMore;
$('tabbar').onclick = e => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); };
$('content').onclick = e => { const b = e.target.closest('.card'); if (b) openLesson((S.byDate[key(S.sel)]||[])[+b.dataset.i]); };
window.addEventListener('scroll', () => $('weekbar').classList.toggle('scrolled', $('weekbar').getBoundingClientRect().top <= 0 && scrollY > 4), {passive:true});

// свайп по списку — соседний день, по полоске недели — соседняя неделя
const swipe = (el, step) => {
  let tx = 0, ty = 0;
  el.addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, {passive:true});
  el.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) select(addDays(S.sel, dx < 0 ? step : -step), dx < 0 ? 1 : -1);
  }, {passive:true});
};
swipe($('content'), 1); swipe($('weekbar'), 7);

setInterval(() => { if (tab === 'schedule' && key(S.sel) === key(today()) && !$('sheet').classList.contains('open')) renderDay(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('sheet').classList.contains('open')) render(); });

/* ---------- boot ---------- */
(async () => {
  await loadGroups();
  if (!localStorage.getItem('notes')){ const n = await store.cloud('notes'); if (n) try { localStorage.setItem('notes', n); } catch(e){} }
  const qs = new URLSearchParams(location.search);
  const startParam = inTG && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  let want = qs.get('group') || startParam || store.get('group') || await store.cloud('group');
  let g = null;
  if (want){
    try { const o = JSON.parse(want); if (o && o.id) g = o; } catch(e){}
    if (!g) g = S.groups.find(x => String(x.id) === String(want) || skey(x.name) === skey(want));
    if (!g && want === 'demo') g = {id:'demo', name:'Демо-группа'};
    if (!g){ // имя группы из ссылки — ищем на сайте
      try { g = (await searchGroups(want)).find(x => normName(x.name) === normName(want)) || null; } catch(e){}
    }
  }
  if (!g && S.groups.length === 1) g = S.groups[0];
  if (g) chooseGroup(g);
  else { await loadSchedule({id:'demo'}); render(); openGroups(); }
})();
})();
</script>
</body>
</html>
